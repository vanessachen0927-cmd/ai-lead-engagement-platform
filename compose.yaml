services:
  api:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      AI_SERVICE_URL: http://ai:8001
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      KEY_STORAGE_PATH: /data/keys
      ConnectionStrings__Sqlite: Data Source=/data/leads.db
      FRONTEND_ORIGIN: http://localhost:5173
    volumes: ["lead_data:/data"]
    depends_on: [ai]
  ai:
    build: ./ai-service
    expose: ["8001"]
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8080
    ports: ["5173:5173"]
    depends_on: [api]
  sqlserver:
    profiles: ["sqlserver"]
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    ports: ["1433:1433"]
    volumes: ["mssql_data:/var/opt/mssql"]
volumes:
  lead_data:
  mssql_data:
